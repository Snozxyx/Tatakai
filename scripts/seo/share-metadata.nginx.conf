# Include inside the website's server block. The Docker DNS resolver must be configured.
# Each site keeps its own release and canonical origin.
location ~ ^/sitemap(-[\w.-]+)?\.(xml|xsl)/?$ {
  set $sitemap_renderer http://website-me-seo:8088;
  proxy_pass $sitemap_renderer;
  proxy_set_header Host $host;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_connect_timeout 2s;
  proxy_read_timeout 20s;
  proxy_intercept_errors on;
  error_page 500 502 503 504 = @sitemap_unavailable;
  add_header X-Content-Type-Options nosniff always;
}
location @sitemap_unavailable {
  default_type application/xml;
  add_header Cache-Control "no-store" always;
  add_header Retry-After "60" always;
  return 503 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"/>';
}
location ~ ^/(anime/[^/]+|manga/[^/]+|novel/[^/]+|user/[^/]+|@[^/]+|(tierlist|playlist|p)/[^/]+|community/forum/[^/]+)/?$ {
  if ($host !~ ^(www\.)?tatakai\.(me|app)$) { rewrite ^ /index.html last; }
  set $share_renderer http://website-me-seo:8088;
  proxy_pass $share_renderer;
  proxy_set_header Host $host;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_hide_header Cache-Control;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy $tatakai_hosted_turnstile_csp always;
  proxy_connect_timeout 2s;
  proxy_read_timeout 5s;
  proxy_intercept_errors on;
  error_page 500 502 503 504 = @share_static_fallback;
}
location @share_static_fallback {
  try_files /index.html =404;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy $tatakai_hosted_turnstile_csp always;
}
