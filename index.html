<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Static SEO (never entity-specific) -->
    <meta name="author" content="Tatakai" />
    <meta name="keywords" content="otaku community, anime community, manga community, anime tracker, manga tracker, anime tier lists, anime playlists, otaku app, anime social network, track anime, track manga, anime watchlist, manga readlist, anime extensions, otaku social, anime fans, manga fans" />

    <!-- Robots Meta -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- SEO:START -->
    <!-- Per-entity meta is injected here server-side (scripts/ptero-start.mjs) for
         shareable routes (anime, manga, profile, post, tier list, playlist).
         The defaults below are served for every other route and as the fallback. -->
    <title>Tatakai — The Otaku Community for Anime &amp; Manga Fans</title>
    <meta name="title" content="Tatakai — The Otaku Community for Anime &amp; Manga Fans" />
    <meta name="description" content="Tatakai is an extension-based otaku community. Track the anime and manga you love, build tier lists and playlists, share your taste, and connect with fellow fans." />
    <link rel="canonical" href="https://tatakai.me" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tatakai — The Otaku Community for Anime &amp; Manga Fans" />
    <meta property="og:description" content="An extension-based otaku community. Track anime and manga, build tier lists and playlists, and connect with fellow fans." />
    <meta property="og:image" content="https://tatakai.me/assets/logo/tatakaibanner.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Tatakai — The Otaku Community" />
    <meta property="og:url" content="https://tatakai.me" />
    <meta property="og:site_name" content="Tatakai" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tatakai — The Otaku Community for Anime &amp; Manga Fans" />
    <meta name="twitter:description" content="An extension-based otaku community. Track anime and manga, build tier lists and playlists, and connect with fellow fans." />
    <meta name="twitter:image" content="https://tatakai.me/assets/logo/tatakaibanner.png" />
    <!-- SEO:END -->

    <!-- Additional SEO Tags -->
    <meta name="language" content="English" />
    <meta name="revisit-after" content="1 days" />
    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tatakai" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/logo/tatakai-logo-square.png" />
    <link rel="apple-touch-icon" href="/assets/logo/tatakai-logo-square.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Tatakai",
          "url": "https://tatakai.me",
          "logo": "https://tatakai.me/assets/logo/tatakai-logo.png"
        },
        {
          "@type": "WebSite",
          "name": "Tatakai",
          "url": "https://tatakai.me",
          "description": "Tatakai is an extension-based otaku community. Track the anime and manga you love, build tier lists and playlists, share your taste, and connect with fellow fans.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://tatakai.me/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>

  <body>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
