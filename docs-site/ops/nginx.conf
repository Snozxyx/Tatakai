worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json text/plain text/markdown image/svg+xml;
  log_format docs '$http_cf_connecting_ip $request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout docs;
  map $uri $docs_cache_control {
    default "public, max-age=0, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~\.(md|txt)$ "public, max-age=300";
  }
  server {
    listen 8080;
    server_name docs.tatakai.me;
    return 308 https://docs.tatakai.app$request_uri;
  }
  server {
    listen 8080 default_server;
    server_name docs.tatakai.app;
    root /releases/docs-current/website;
    index index.html;
    etag on;
    add_header Cache-Control $docs_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    error_page 404 /404.html;
    location = /health/ready {
      default_type application/json;
      return 200 '{"status":"ready","service":"tatakai-docs"}';
    }
    location = /welcome-to-tatakai { return 308 https://docs.tatakai.app/; }
    location ~ ^(.+)/$ { return 308 https://docs.tatakai.app$1$is_args$args; }
    location ~ /\. { return 404; }
    location ~ \.(md|txt)$ {
      types { text/markdown md; text/plain txt; }
      try_files $uri =404;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
  }
}
