buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.4.0'
    }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'app.tatakai.compatibility.mihon'
    compileSdk 36
    defaultConfig { minSdk 24; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.java.srcDirs += ['src/main/kotlin', 'vendor']
}
dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'uy.kohesive.injekt:injekt-core:1.16.1'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-brotli:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-zstd:5.3.2'
    implementation 'com.squareup.zstd:zstd-kmp-okio:0.4.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.compose.runtime:runtime-android:1.8.3'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.18.3'
    implementation 'com.android.tools.build:apksig:8.13.0'
}
