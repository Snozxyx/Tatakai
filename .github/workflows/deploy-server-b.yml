name: Build Tatakai website for Server B
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: tatakai-website-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build production website
        run: npm run build -- --mode web
        env:
          VITE_SUPABASE_URL: https://db.tatakai.me
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BACKEND_ORIGIN: https://api.tatakai.me
          VITE_TATAKAI_API_URL: https://api.tatakai.me/api/v3
          VITE_OPERATIONS_AUTH_ENABLED: 'true'
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: https://us.i.posthog.com
      - name: Package verified release
        run: |
          test -s dist/index.html
          mkdir -p server-release
          cp -a dist server-release/website
          node -e 'require("fs").writeFileSync("server-release/release.json", JSON.stringify({component:"website",commit:process.env.GITHUB_SHA}))'
      - uses: actions/upload-artifact@v4
        id: release_artifact
        continue-on-error: true
        with:
          name: tatakai-server-b
          path: server-release/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve verified build when Actions storage is full
        if: steps.release_artifact.outcome == 'failure'
        run: node scripts/publish-server-build.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure congestion control for the measured lossy build-transfer path
        run: |
          sudo modprobe tcp_bbr 2>/dev/null || true
          if grep -qw bbr /proc/sys/net/ipv4/tcp_available_congestion_control; then
            sudo sysctl -q -w net.ipv4.tcp_congestion_control=bbr
          fi
      - name: Deliver verified build archive to Server B
        if: github.event_name == 'push' && steps.release_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ARTIFACT_ID: ${{ steps.release_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.release_artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess,json,hashlib,tempfile
          task=pathlib.Path(tempfile.mkdtemp(prefix='tatakai-delivery-'))
          key=task/'key';key.write_text(os.environ['DEPLOY_SSH_KEY'].replace('\r\n','\n').rstrip()+'\n');key.chmod(0o600)
          known=task/'known_hosts';known.write_text(os.environ['DEPLOY_KNOWN_HOSTS'])
          archive=task/'release.zip';repo=os.environ['GITHUB_REPOSITORY'];artifact=os.environ['ARTIFACT_ID']
          with archive.open('wb') as output:subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{artifact}/zip'],stdout=output,check=True)
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive.stat().st_size<=500000000 and digest==os.environ['ARTIFACT_DIGEST'].removeprefix('sha256:')
          header={'repository':repo,'artifactId':artifact,'digest':digest}
          proc=subprocess.Popen(['ssh','-T','-o','IPQoS=none','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=3','-i',str(key),'-o','BatchMode=yes','-o',f'UserKnownHostsFile={known}','-o','StrictHostKeyChecking=yes','ubuntu@137.23.42.34'],stdin=subprocess.PIPE)
          proc.stdin.write((json.dumps(header)+'\n').encode())
          with archive.open('rb') as source:
            while chunk:=source.read(65536):proc.stdin.write(chunk)
          proc.stdin.close();assert proc.wait(timeout=300)==0
          key.unlink();archive.unlink()
          PY
