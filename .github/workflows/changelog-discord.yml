name: Changelog to Discord

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged PR number (required for a manual preview or resend)'
        required: true
        type: string
      dry_run:
        description: 'Generate the changelog without sending to Discord'
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-discord-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out or execute the PR head with access to secrets.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/changelog-discord.mjs
      - name: Preserve generated changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog-pr-${{ github.event.pull_request.number || inputs.pr_number }}
          path: .artifacts/changelog/
          retention-days: 90
          if-no-files-found: error
      - name: Send changelog to Discord
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          DISCORD_CHANGELOG_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
        run: node scripts/changelog-discord.mjs --send
